<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBlog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="site-title">✍️ OpenBlog</a>
        <div class="header-actions">
          <input type="search" id="searchInput" placeholder="Search posts…" class="search-input" autocomplete="off">
          <a href="editor.html" class="btn btn-primary">+ New Post</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="container main-content">
    <div id="postsGrid" class="posts-grid"></div>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">📝</div>
      <h2>Nothing here yet</h2>
      <p id="emptyMsg">Create your first blog post to get started.</p>
      <a href="editor.html" class="btn btn-primary" style="margin-top:8px;">Write your first post</a>
    </div>
  </main>

  <!-- Confirm dialog -->
  <div id="confirmOverlay" class="confirm-overlay hidden" role="dialog" aria-modal="true">
    <div class="confirm-box">
      <div class="confirm-icon">🗑</div>
      <div class="confirm-title">Delete post?</div>
      <div class="confirm-msg" id="confirmMsg">This cannot be undone.</div>
      <div class="confirm-actions">
        <button id="confirmNo"  class="btn btn-secondary">Cancel</button>
        <button id="confirmYes" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
